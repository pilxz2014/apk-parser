<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK 工具箱 · 主控台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="logo">📦</span>
      <span>APK 工具箱</span>
      <span class="ver" id="ver"></span>
    </div>

    <div class="row grow" style="flex:1 1 auto; margin:0; align-items:center;">
      <span class="dim" style="color:var(--dim);font-size:12px;">设备</span>
      <select id="dev-pick" style="width:auto;min-width:230px;"></select>
      <button class="btn sm" id="dev-refresh" title="重新枚举设备">刷新</button>
      <span id="dev-state" class="tag plain"></span>
    </div>

    <button class="btn sm" id="btn-doctor" title="环境自检">🩺 自检</button>
    <button class="btn sm" id="btn-apk-open" title="解析一个本机 APK">📂 打开 APK</button>
    <button class="btn sm" id="btn-shutdown" title="停止主控台">⏻</button>
  </header>

  <div id="body">
    <aside id="sidebar"></aside>
    <main id="main"></main>
  </div>
</div>

<div id="toasts"></div>
<div id="modal-root"></div>

<script src="/app.js"></script>
</body>
</html>
